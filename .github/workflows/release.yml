name: Tag Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag and dispatch build if version changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — package.json version wasn't bumped, nothing to release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          # A tag pushed with the default GITHUB_TOKEN does NOT trigger other
          # workflows (GitHub's anti-recursion safeguard), so build.yml's
          # "push: tags: v*" trigger would never fire on its own. Dispatch it
          # explicitly instead — it already supports workflow_dispatch.
          gh workflow run build.yml --ref "$TAG"
          echo "Pushed tag $TAG and dispatched the build & release workflow."
